name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pytest
      - run: pytest -q tests
      - run: python tools/blapp.py validate examples/freesurfer-7.3.2.brainlife.app.json --registry tests/fixtures/freesurfer-7.3.2.registry.json
